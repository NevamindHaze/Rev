# Builds Rev on a Mac in GitHub's cloud, then publishes it so SideStore
# can install and update it directly on your iPhone.
#
# It runs automatically every time you change files on the "main" branch,
# and you can also start it by hand: Actions tab → "iOS Build" → "Run workflow".
#
# SideStore source link (add it once in SideStore → Sources → +):
#   https://github.com/<your-name>/<repo>/releases/latest/download/source.json

name: iOS Build

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allows this workflow to create Releases in your repo.
permissions:
  contents: write

# Every build gets a new version number (1.0.2, 1.0.3, ...) so SideStore sees updates.
env:
  VERSION: 1.0.${{ github.run_number }}
  BUILD: ${{ github.run_number }}

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Set the version number
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" Supporting/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD" Supporting/Info.plist

      - name: Build the app (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project Rev.xcodeproj \
            -scheme Rev \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -quiet \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package the .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Rev.app Payload/
          zip -qry Rev.ipa Payload

      - name: Write the SideStore source file
        run: |
          SIZE=$(stat -f%z Rev.ipa)
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/Rev.ipa"
          ICON="https://github.com/${GITHUB_REPOSITORY_OWNER}.png"
          cat > source.json <<EOF
          {
            "name": "Rev",
            "identifier": "com.personal.rev.source",
            "apps": [
              {
                "name": "Rev",
                "bundleIdentifier": "com.personal.rev",
                "developerName": "${GITHUB_REPOSITORY_OWNER}",
                "localizedDescription": "Personal flashcard app.",
                "iconURL": "${ICON}",
                "version": "${VERSION}",
                "versionDate": "${DATE}",
                "downloadURL": "${URL}",
                "size": ${SIZE},
                "versions": [
                  {
                    "version": "${VERSION}",
                    "buildVersion": "${BUILD}",
                    "date": "${DATE}",
                    "downloadURL": "${URL}",
                    "size": ${SIZE},
                    "minOSVersion": "17.0"
                  }
                ]
              }
            ],
            "news": []
          }
          EOF
          cat source.json

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${VERSION}" Rev.ipa source.json \
            --repo "$GITHUB_REPOSITORY" \
            --title "Rev ${VERSION}" \
            --notes "Automatic build #${BUILD}" \
            --latest

      - name: Upload the .ipa (backup copy)
        uses: actions/upload-artifact@v4
        with:
          name: Rev-ipa
          path: Rev.ipa
          retention-days: 30
