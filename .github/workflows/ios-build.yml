# Builds Rev on a Mac in GitHub's cloud and gives you an unsigned .ipa
# that you can install with SideStore.
#
# It runs automatically every time you upload/change files on the "main" branch,
# and you can also start it by hand: Actions tab → "iOS Build" → "Run workflow".

name: iOS Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Build the app (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project Rev.xcodeproj \
            -scheme Rev \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -quiet \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package the .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Rev.app Payload/
          zip -qry Rev.ipa Payload

      - name: Upload the .ipa
        uses: actions/upload-artifact@v4
        with:
          name: Rev-ipa
          path: Rev.ipa
          retention-days: 30
